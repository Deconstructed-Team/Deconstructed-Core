# The mod's build settings: ForgeDevEnv's, then the mod's own at the end.
org.gradle.jvmargs = -Xmx3G

# Source Options
# Modern Java syntax (var, switch expressions, pattern instanceof, text blocks) compiled to Java 8, courtesy of Jabel.
# Records are not covered by Jabel. On: the upstream 1.21 code is written that way.
use_modern_java_syntax = true
use_jetbrains_annotations = false

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = true
show_testing_output = false

# Mod Information
mod_version = 1.0.0
root_package = dev.feldsher
mod_url =
mod_update_json =
mod_authors = Feldsher
mod_logo_path = assets/deconstructedcore/logo.png

# Mapping Properties
mapping_channel = stable
mapping_version = 39
use_dependency_at_files = true

# Run Configurations
minecraft_username = Developer
extra_jvm_args =
extra_tweak_classes =

# Modify Minecraft Sources
change_minecraft_sources = false

# Tags: generated <root_package>.<mod_id>.Tags class
use_tags = true
tag_class_name = ${root_package}.${mod_id}.Tags

# Access Transformers: <mod_id>_at.cfg in the root of src/main/resources
use_access_transformer = false
access_transformer_locations = ${mod_id}_at.cfg

# Mixins (MixinBooter). Turned on per mod when it needs them.
use_mixins = false
mixin_booter_version = 11.18
generate_mixins_json = false
mixin_configs = mixins.${mod_id}.json
mixin_connector_class =
mixin_refmap = mixins.${mod_id}.refmap.json

# Coremods: none, ASM transformers are avoided.
is_coremod = false
coremod_includes_mod = true
coremod_plugin_class_name =

# AssetMover
use_asset_mover = false
asset_mover_version = 2.5

# The mod
mod_id = deconstructedcore
mod_name = Deconstructed Core
mod_description = Library for the Deconstructed mods. Based on Sophisticated Core by P3pp3rF1y (GPLv3 version, before 2025-02-10).
mod_credits = P3pp3rF1y, the author of Sophisticated Core
