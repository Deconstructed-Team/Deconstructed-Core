# Publishes built jars to GitHub Releases when a version tag is pushed.
name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # any semver tag, e.g. v1.2.3
  # Lets a release be re-run against a tag that is already pushed, instead of deleting and re-pushing it.
  workflow_dispatch:

jobs:
  Publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write # needed to create GitHub releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # The jars are named after mod_version in gradle.properties, not after the tag, so the two must agree.
      - name: Check Version
        run: |
          version=$(grep -E '^mod_version *=' gradle.properties | sed -E 's/^mod_version *= *//; s/ *$//')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match mod_version $version in gradle.properties"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21' # the Gradle process only; the mod still compiles to Java 8 bytecode

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never
          gradle-home-cache-includes: |
            caches
            jdks
            notifications
            wrapper

      - name: Build Project
        run: ./gradlew build --build-cache

      - name: Publish to GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: "build/libs/*.jar"
          generate_release_notes: true
          fail_on_unmatched_files: true
